<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSNerves</title>
  <link href="style.css" type="text/css" rel="stylesheet"/>
</head>
<body>
<div id="term_wrap">
  <div id="term_container">
  </div>
  <textarea id="term_input" aria-label="Terminal input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" rows="1"></textarea>
  <div id="image_progress" class="loader" aria-label="Disk image download">
    <div class="loader_track"><div class="loader_bar"></div></div>
    <div class="loader_label">loading the emulator</div>
  </div>
  <div id="boot_stage" class="status"></div>
  <div id="disk_status" class="status"></div>
</div>
<script type="text/javascript" src="term.js"></script>
<script type="text/javascript" src="nerves-vm.js"></script>
<script type="text/javascript" src="page.js"></script>
</body>
</html>
